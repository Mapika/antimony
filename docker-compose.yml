# Local dev/test dependencies. `docker compose up -d`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ant
      POSTGRES_PASSWORD: ant
      POSTGRES_DB: ant
    ports: ["54329:5432"]
    command: ["postgres", "-c", "max_connections=500"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ant"]
      interval: 2s
      retries: 30

  # S3-compatible object store for tests (Apache-2.0). No identities configured,
  # so any access key/secret is accepted.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-ip.bind=0.0.0.0"]
    ports: ["9009:8333"]

  # `docker compose --profile server up -d`: the antimony server itself,
  # against the services above. Not started by plain `docker compose up -d`.
  ant:
    profiles: ["server"]
    build: .
    command:
      - serve
      - --pg-url=postgres://ant:ant@postgres:5432/ant
      - --s3-endpoint=http://s3:8333
      - --s3-bucket=ant
      - --s3-access-key=x
      - --s3-secret-key=x
    ports: ["7420:7420", "7421:7421"]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
