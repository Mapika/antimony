# PostgreSQL 17 for antimony on one host: 8 vCPU / 16 GB RAM, the container
# limited to 6 GB (compose.yaml), local NVMe or SSD storage.
# Scale shared_buffers with the container's memory limit: ~25-40 %.
#
# Durability: fsync, synchronous_commit and full_page_writes stay ON. Every
# land is one durable Postgres commit and agents rely on it, so landing
# throughput is bounded by your disk's fsync latency (check with
# `pg_test_fsync`). Do not trade durability for speed here.

# --- connections ---------------------------------------------------------
listen_addresses = '*'          # reachable only on the private compose network
# ant serve: pg-max-connections (64) + admin/backup sessions. Raise when you
# add replicas: replicas x (max + lock connections) < max_connections - 20.
max_connections = 150
password_encryption = scram-sha-256

# --- memory --------------------------------------------------------------
shared_buffers = 2GB
effective_cache_size = 4GB      # what Postgres + OS cache can hold in the container
work_mem = 16MB
maintenance_work_mem = 512MB    # VACUUM, CREATE INDEX (history index builds)
huge_pages = off

# --- WAL and checkpoints -------------------------------------------------
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = zstd
wal_level = replica
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9   # spread checkpoint I/O (land p99 spikes at checkpoints)
wal_buffers = 64MB

# --- planner / storage ---------------------------------------------------
random_page_cost = 1.1          # SSD
effective_io_concurrency = 200
default_statistics_target = 100

# --- autovacuum (objects / changes / history grow with every land) -------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# --- logging -------------------------------------------------------------
log_destination = 'stderr'
log_min_duration_statement = 1000   # ms; slow statements show up in `docker compose logs postgres`
log_checkpoints = on
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '

# --- misc ----------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
shared_preload_libraries = ''
