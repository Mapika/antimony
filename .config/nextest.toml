# Test tiers (see CONTRIBUTING.md):
#   fast: cargo nextest run --workspace                      (no external services)
#   full: cargo nextest run --workspace --run-ignored all     (Postgres/S3/FUSE/e2e)
[profile.default]
slow-timeout = { period = "30s", terminate-after = 10 }
fail-fast = false

# The rw write benchmark (full size only with ANT_RW_BENCH=1) writes several
# GiB and builds a crate twice; give it room.
[[profile.default.overrides]]
filter = 'test(rw_write_bench)'
slow-timeout = { period = "60s", terminate-after = 30 }

# One full Postgres concurrency case per proptest case (~0.5 s each): deep
# runs (PROPTEST_CASES=1000) take several minutes.
[[profile.default.overrides]]
filter = 'test(concurrent_lands_postgres)'
slow-timeout = { period = "60s", terminate-after = 30 }
