[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

# All third-party dependencies are declared here so crates (and parallel
# implementers) never need to touch versions. Crates opt in with `{ workspace = true }`.
[workspace.dependencies]
ant-core = { path = "crates/ant-core" }
ant-store = { path = "crates/ant-store" }
ant-proto = { path = "crates/ant-proto" }
ant-server = { path = "crates/ant-server" }
antd = { path = "crates/antd" }
ant-fuse = { path = "crates/ant-fuse" }
ant-gitbridge = { path = "crates/ant-gitbridge" }

anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
diffy = "0.4"
fuser = { version = "0.18", default-features = false }
futures = "0.3"
gix = { version = "0.89", default-features = false, features = ["max-performance-safe", "revision", "sha1"] }
globset = "0.4"
hex = "0.4"
libc = "0.2"
lru = "0.16"
parking_lot = "0.12"
proptest = "1"
prost = "0.14"
protox = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
# Keep the shared agent build cache small; full debuginfo is rarely needed.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
